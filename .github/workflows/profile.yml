name: refresh profile

on:
  schedule:
    - cron: "23 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - "profile/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: fetch stats
        run: python profile/fetch_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: render images
        run: python profile/render.py

      - name: commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.json assets
          git diff --cached --quiet || git commit -m "chore(profile): refresh stats"
          git push

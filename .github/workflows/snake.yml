name: generate snake

on:
  schedule:
    - cron: "0 0 * * *" 
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Blazing-Falcon
          outputs: |
            dist/github-snake.svg?color_snake=#af3a03&color_dots=#ebdbb2,#d9d6a2,#b8bb26,#98971a,#79740e
            dist/github-snake-dark.svg?color_snake=#fe8019&color_dots=#3c3836,#5f5f14,#79740e,#98971a,#b8bb26

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
